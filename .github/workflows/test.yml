# Runs the module test suite. The suite deliberately needs no C-FFI library:
# forge.sld takes an injected transport, so kaappi-http and kaappi-net — which
# need a built shared object and OpenSSL — stay out of CI entirely. Only
# kaappi-json, which is pure Scheme, is fetched.
name: test

# Unfiltered by path, like the docs check, so it is safe to mark required.
# See .github/workflows/docs.yml for why the paths-ignore companion trick
# does not work.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KAAPPI_VERSION: v0.26.1
  # The agent mesthiri drives. Pinned to the version docs/pi-rpc.md was
  # recorded against, and to the version .mesthiri/config.scm scaffolds:
  # tests/test-agent-live.scm asserts protocol details, so a floating
  # version would turn a pi release into a mystery failure here.
  PI_VERSION: 0.84.4

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned kaappi binary
        run: |
          set -euo pipefail
          curl -fsSL -o kaappi \
            "https://github.com/kaappi/kaappi/releases/download/${KAAPPI_VERSION}/kaappi-x86_64-linux"
          chmod +x kaappi
          sudo mv kaappi /usr/local/bin/kaappi
          kaappi --version

      - name: Fetch kaappi-json
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kaappi/kaappi-json ../kaappi-json

      # openssl signs the App JWT; present on every standard image, but the
      # jwt tests are the ones that would fail confusingly without it.
      - name: Check openssl is present
        run: openssl version

      # Without pi, tests/test-agent-live.scm skips — and that test is the
      # only one that proves run-agent spawns anything at all. It talks to a
      # stub model server on localhost, so no API key and no egress.
      - name: Install pi
        run: |
          set -euo pipefail
          npm i -g "@earendil-works/pi-coding-agent@${PI_VERSION}"
          pi --version

      # The agent runs contained, so the suite has to be able to build the
      # container — otherwise tests/test-sandbox.scm asserts against a
      # sandbox that is not there and passes for the wrong reason. Same two
      # steps the reusable workflow does, and for the same reason: 24.04
      # ships kernel.apparmor_restrict_unprivileged_userns=1, under which
      # bwrap is installed and still cannot create a namespace.
      - name: Install the sandbox
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --share-net --die-with-parent --new-session \
                --ro-bind / / --proc /proc --dev /dev -- /bin/true
          echo "bubblewrap $(bwrap --version | awk '{print $2}') works"

      - run: ./tests/run-all.sh
        env:
          MESTHIRI_LIBS: ../kaappi-json/lib

  # The macOS leg of the same suite (#5). A second job and not a matrix on
  # purpose: a matrix renames the legs to `suite (ubuntu-latest)` and
  # `suite (macos-latest)`, the plain `suite` context that branch protection
  # requires would never report again, and every merge would be back to
  # needing --admin — the failure #5 was filed about.
  #
  # Why a second platform at all: the pinned kaappi v0.26.1 Linux binary
  # refuses spawn-process directory: on every Linux host (kaappi#2517), so
  # the ubuntu leg can only exercise the /bin/sh fallback live. macOS
  # honours directory:, so this leg is where the primary spawn path runs
  # against a real pi. When kaappi#2517 ships and KAAPPI_VERSION is bumped,
  # both legs run the primary path and the fallback keeps its unit checks on
  # every platform (tests/test-agent.scm runs the script for real).
  #
  # Not added to required checks: it has never run green on main yet, and a
  # required context that has never reported blocks merges exactly like a
  # failing one. Require it from branch protection once it has.
  suite-macos:
    runs-on: macos-latest   # arm64; the artifact below is pinned to match
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned kaappi binary
        run: |
          set -euo pipefail
          curl -fsSL -o kaappi \
            "https://github.com/kaappi/kaappi/releases/download/${KAAPPI_VERSION}/kaappi-aarch64-macos"
          chmod +x kaappi
          sudo mv kaappi /usr/local/bin/kaappi
          kaappi --version

      - name: Fetch kaappi-json
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kaappi/kaappi-json ../kaappi-json

      # The jwt tests sign through this; runners ship LibreSSL, whose dgst
      # and base64 cover everything they call.
      - name: Check openssl is present
        run: openssl version

      - name: Install pi
        run: |
          set -euo pipefail
          npm i -g "@earendil-works/pi-coding-agent@${PI_VERSION}"
          pi --version

      # No sandbox step: bwrap is Linux-only by design, and the suite says
      # so loudly on this platform rather than failing (test-sandbox.scm
      # asserts the refusal reason when the sandbox is absent). This leg
      # runs tests, not jobs — no mesthiri stage runs here, and the live
      # test's pi talks to a stub model server on localhost.
      - run: ./tests/run-all.sh
        env:
          MESTHIRI_LIBS: ../kaappi-json/lib
