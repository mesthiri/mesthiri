# Builds mesthiri.org — the user guide and a landing page — and deploys it
# to GitHub Pages. The build runs with --strict on every push and pull
# request, so a broken link in the guide fails the check a pull request
# sees; only main deploys.
#
# Unfiltered by path for the reason docs.yml gives: a path-filtered
# workflow does not run when nothing matches, which leaves a required
# check stuck. Building the site costs about a minute.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled. Deploys queue and never
# cancel, so main is always served by a run that finished.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: mkdocs build --strict

      # Only main's build is worth uploading; a pull request's is the check.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # github.ref is refs/pull/N/merge for a pull request and the branch for
    # a manual dispatch, so this one condition covers both.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # The only job with write access, and the only thing it can write is
    # the Pages deployment. Pages must be set to deploy from GitHub Actions
    # in the repository's settings for this to succeed.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
