# mesthiri — reusable dispatch workflow
#
# Called by the shim in each installed repository. This is where fixes ship:
# a change here reaches every installed repo without a pull request to each,
# which is also why the binary's checksum is verified rather than trusted.
name: reusable-dispatch

on:
  workflow_call:
    secrets:
      # Optional, and checked at run time instead: an inheriting shim
      # supplies MESTHIRI_READER_KEY below rather than this, and a required
      # secret nothing is named fails the run before any job starts.
      reader-key: { required: false }
      writer-key: { required: false }
      model-key:  { required: false }
      # `secrets: inherit` hands the caller's secrets over under THEIR names,
      # so a shim that inherits cannot satisfy `reader-key` — nothing is
      # called that. Both spellings are accepted and both are optional: a
      # shim that maps explicitly keeps working, and one that inherits
      # supplies these instead. Exactly one pair will be set.
      MESTHIRI_READER_KEY: { required: false }
      MESTHIRI_WRITER_KEY: { required: false }
    inputs:
      # Shell run in the job before dispatch, for whatever the TARGET
      # repository's own tests need — its compiler, its interpreter, its
      # package manager. mesthiri cannot know that: a Scheme library needs a
      # Scheme, a Rust crate needs cargo, and guessing would be worse than
      # asking.
      #
      # It matters because the code stage's prompt tells the agent to get the
      # project's test command green before reporting done. Without the
      # toolchain that rule is unsatisfiable, and a good agent does not
      # shrug — the first live run spent 35 of its 40 turns hunting for an
      # interpreter, including running `strings` on the mesthiri binary, and
      # then failed on budget having written nothing.
      #
      # This is the maintainers' own shim on their base branch, so it is
      # their code and their decision, exactly like `test-command`. It runs
      # OUTSIDE the sandbox — it has to, since installing a toolchain needs
      # network and system paths — and therefore before the agent starts.
      setup:
        required: false
        type: string
        default: ""
      # Space-separated names of repository secrets holding model API keys —
      # the names a config's `(secret …)` fields use. The caller must also
      # pass `secrets: inherit`, since a reusable workflow cannot receive a
      # secret whose name it does not declare, and mesthiri cannot declare
      # names that belong to the target repository.
      #
      # Only the names listed here are exported. `secrets: inherit` makes
      # every repository secret reachable by the workflow; this step is what
      # decides which of them become environment variables, and the
      # maintainers write that list in their own shim.
      #
      # Without this a repository can fund exactly one provider, because the
      # single `model-key` input lands in one variable. That collides with
      # the rule that review must not run the implementer's model: on an
      # account funding one model, review cannot run at all.
      model-secrets:
        required: false
        type: string
        default: ""

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checks out the BASE branch. Under pull_request_target that is the
      # default and is the point: mesthiri reads .mesthiri/config.scm and the
      # rubric, which are the maintainers' files, never the pull request's.
      # `persist-credentials: false` keeps the job token out of .git/config,
      # where a later step could reuse it by accident.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned mesthiri release
        env:
          MESTHIRI_VERSION: v0.1.14
        run: |
          set -euo pipefail
          base="https://github.com/mesthiri/mesthiri/releases/download/${MESTHIRI_VERSION}"
          plat=x86_64-linux

          # Three files, not one. The binary embeds mesthiri's Scheme
          # bytecode, but kaappi's HTTP and TLS support is a C library the
          # runtime dlopen()s — so the binary alone starts and then fails with
          # `ffi-open: libkaappi_net: cannot open shared object file`. v0.1.0
          # shipped exactly that.
          curl -fsSL -o mesthiri "${base}/mesthiri-${plat}"
          curl -fsSL -o "libkaappi_net.so"  "${base}/libkaappi_net-${plat}.so"
          curl -fsSL -o "libkaappi_http.so" "${base}/libkaappi_http-${plat}.so"
          curl -fsSL -o SHA256SUMS "${base}/SHA256SUMS"

          # Verify all three before anything is made executable or loaded.
          # Every installed repo fetches these from a repository they do not
          # control; the checksums are what bound that trust.
          {
            grep " mesthiri-${plat}\$"          SHA256SUMS | sed 's/ .*/  mesthiri/'
            grep " libkaappi_net-${plat}.so\$"  SHA256SUMS | sed 's/ .*/  libkaappi_net.so/'
            grep " libkaappi_http-${plat}.so\$" SHA256SUMS | sed 's/ .*/  libkaappi_http.so/'
          } > expected.sha256
          sha256sum -c expected.sha256

          # The loader looks here and nowhere useful otherwise.
          mkdir -p ~/.kaappi/lib
          mv libkaappi_net.so libkaappi_http.so ~/.kaappi/lib/
          chmod +x mesthiri

      # The agent runs inside a bubblewrap namespace, and mesthiri refuses to
      # run it otherwise — so this step is load-bearing, not a convenience.
      #
      # Two things are needed and only the first is obvious. bubblewrap is not
      # on the runner image. And Ubuntu 24.04 ships
      # kernel.apparmor_restrict_unprivileged_userns=1, under which bwrap is
      # installed, executable, and fails at `setting up uid map: Permission
      # denied` — so installing it alone buys nothing. The sysctl relaxes that
      # for this VM, which is ephemeral and discarded with the job.
      #
      # Note the direction: this widens what the RUNNER may do so that
      # mesthiri can narrow what the AGENT may do. The agent ends up with
      # strictly less than it had before this step existed.
      - name: Install the sandbox
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Prove it before the job depends on it. Failing here is a clear
          # setup error; failing later is an agent run that dies mid-flight.
          bwrap --unshare-all --share-net --die-with-parent --new-session \
                --ro-bind / / --proc /proc --dev /dev -- /bin/true
          echo "bubblewrap $(bwrap --version | awk '{print $2}') works"

      # mesthiri drives pi; it does not embed it. Without this the binary
      # downloads cleanly, authorizes the event, matches a stage, and then
      # fails at the one thing it exists to do.
      #
      # Pinned, and the pin is coupled to two things it cannot check from
      # here: docs/pi-rpc.md records the protocol at this version, and
      # `(agent (version …))` in a target's config states it. A workflow
      # cannot parse Scheme, so the coupling is a comment and a release-time
      # check rather than a mechanism.
      - name: Install the pinned agent
        env:
          PI_VERSION: 0.84.4
        run: |
          set -euo pipefail
          npm i -g "@earendil-works/pi-coding-agent@${PI_VERSION}"
          pi --version

      - name: Set up the target's toolchain
        if: inputs.setup != ''
        run: ${{ inputs.setup }}

      - name: Export the named model secrets
        if: inputs.model-secrets != ''
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          WANTED: ${{ inputs.model-secrets }}
        run: |
          set -euo pipefail
          for name in $WANTED; do
            case "$name" in
              [A-Za-z_][A-Za-z0-9_]*) ;;
              *) echo "::error::not a usable variable name: $name"; exit 1 ;;
            esac
            v=$(printf '%s' "$ALL_SECRETS" | jq -r --arg n "$name" '.[$n] // empty')
            if [ -z "$v" ]; then
              echo "::warning::$name is named in model-secrets but not set on this repository"
              continue
            fi
            # Already masked as a secret; masking again costs nothing and
            # covers the case where it arrived some other way.
            echo "::add-mask::$v"
            {
              echo "$name<<MESTHIRI_EOF"
              echo "$v"
              echo "MESTHIRI_EOF"
            } >> "$GITHUB_ENV"
            echo "exported $name"
          done

      # Declared-optional above so either shim shape works, so the check
      # that one of them actually arrived belongs here.
      - name: Check the App keys arrived
        env:
          READER: ${{ secrets.reader-key || secrets.MESTHIRI_READER_KEY }}
          WRITER: ${{ secrets.writer-key || secrets.MESTHIRI_WRITER_KEY }}
        run: |
          if [ -z "${READER:-}" ]; then
            echo "::error::no reader App key. Pass reader-key, or add"\
                 "MESTHIRI_READER_KEY as a repository secret and use"\
                 "'secrets: inherit' in your shim."
            exit 1
          fi
          [ -n "${WRITER:-}" ] || echo "::warning::no writer App key: stages that push will fail"
          echo "App keys present"

      - name: Dispatch
        env:
          MESTHIRI_READER_KEY: ${{ secrets.reader-key || secrets.MESTHIRI_READER_KEY }}
          MESTHIRI_WRITER_KEY: ${{ secrets.writer-key || secrets.MESTHIRI_WRITER_KEY }}
          MESTHIRI_MODEL_KEY: ${{ secrets.model-key }}
          MESTHIRI_EVENT_NAME: ${{ github.event_name }}
          MESTHIRI_EVENT_PATH: ${{ github.event_path }}
          MESTHIRI_REPO: ${{ github.repository }}
          MESTHIRI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./mesthiri dispatch

      # The trace is the run record plus the per-turn detail retro reads —
      # a CI artifact rather than a database row, so retention is CI's.
      # `if: always()` because a failed run is the one worth reading.
      - name: Upload the run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesthiri-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mesthiri-trace-*.jsonl
          if-no-files-found: ignore
          retention-days: 30
