# Validates every Mermaid block in docs/. A broken diagram fails silently on
# GitHub and reads as a missing section, so this is the one docs failure worth
# a CI job while the repository still has no code.
name: docs

# Deliberately unfiltered by path. A path-filtered workflow simply does not
# run when nothing matches, so as a *required* check it leaves a pull request
# stuck on a check that will never report. The usual workaround — a second
# workflow with paths-ignore and the same job name, reporting success — is
# unsound: `paths` runs if ANY changed file matches while `paths-ignore` skips
# only if EVERY changed file matches, so a commit touching docs/ and something
# else fires both, and the requirement can be satisfied by the stub. Running
# the real check every time costs about a minute and cannot go wrong.
on:
  push:
    branches: [main]
  pull_request:

# Read-only. This workflow holds no secrets and needs nothing else.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No package.json on purpose: these two are a check-time tool, not a
      # dependency of anything mesthiri ships.
      - run: npm i --no-save mermaid jsdom

      - run: node scripts/check-diagrams.mjs
